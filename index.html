<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Media Downloader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <!-- TOP TOGGLE -->
    <div class="top-toggle">
        <button class="active" onclick="showSection('sp', this)">Spotify</button>
        <button onclick="showSection('sa', this)">JioSaavn</button>
    </div>

    <section id="sp" class="section active">
        <h1>DS Spotify Downloader</h1>
        <form method="GET" action="/spotify">
            <label>Spotify Track URL</label>
            <input name="url" required>
            <button type="submit">Download</button>
        </form>
    </section>

    <section id="sa" class="section">
        <h1>DS JioSaavn Downloader</h1>
        <input id="saavnQuery" placeholder="Song name">
        <button onclick="searchSaavn()">Search</button>
        <div id="saavnResults"></div>
    </section>
</div>



<footer class="footer">
    Made With <span class="heart">❤️</span> By <span class="name">Sanchit</span>
</footer>

<script>
function showSection(id, btn) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".top-toggle button").forEach(b => b.classList.remove("active"));

    document.getElementById(id).classList.add("active");
    btn.classList.add("active");
}
    
async function searchSaavn() {
    const q = document.getElementById("saavnQuery").value.trim();
    if (!q) return;

    const res = await fetch(`/saavn/search?q=${encodeURIComponent(q)}`);
    const songs = await res.json();

    const box = document.getElementById("saavnResults");
    box.innerHTML = "";

    songs.forEach(s => {
        const btn = document.createElement("button");
        btn.textContent = `${s.title} - ${s.artist}`;
        btn.onclick = () => {
            window.location.href =
                `/saavn/download?url=${encodeURIComponent(s.url)}&title=${encodeURIComponent(s.title)}&artist=${encodeURIComponent(s.artist)}`;
        };
        box.appendChild(btn);
    });
}
</script>

</body>
</html>
